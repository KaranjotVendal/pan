[project]
name = "pan"
version = "0.1.0"
description = "Slack-driven laptop coding-agent orchestrator"
requires-python = ">=3.14"
authors = [{ name = "Karanjot Vendal", email = "karanjotgharu60@gmail.com" }]
dependencies = [
    "pydantic>=2.13.4",
    "slack-bolt>=1.30.0",
    "typer>=0.27.0",
    "watchdog>=6.0.0",
]

[project.scripts]
pan = "pan.frontend.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pan"
module-root = "src"
# The per-layer lint configs and ruff's cache are for development only.
wheel-exclude = ["**/ruff.toml", "**/.ruff_cache"]
source-exclude = ["**/.ruff_cache"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

# Layer import rules live in src/pan/<layer>/ruff.toml (see decisions/0001-layers.md).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"slack_bolt".msg = "Slack libraries belong in frontend/gateway only (see decisions/0001-layers.md)"
"slack_sdk".msg = "Slack libraries belong in frontend/gateway only (see decisions/0001-layers.md)"

[tool.ruff.lint.per-file-ignores]
"src/pan/frontend/gateway/**" = ["TID251"]
"tests/unit/test_gateway_app.py" = ["TID251"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    "ty>=0.0.60",
]
